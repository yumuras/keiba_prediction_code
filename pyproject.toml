[project]
name = "keiba-prediction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "pdfplumber>=0.11",
    "requests>=2.34.2",
    "scikit-learn>=1.4",
